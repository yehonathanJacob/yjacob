worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Standard WebSocket upgrade map: send "upgrade" only when client requested it,
    # otherwise close (don't send a stray Connection: upgrade on plain HTTP).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- HTTP apps (.test) ----------

    server {
        listen 80;
        server_name vote.test;

        # Next.js 16 dev rejects the webpack HMR WebSocket when the upstream
        # Host isn't localhost. Without this override the WS connects, drops
        # within seconds, and the HMR client triggers a full-page reload —
        # which resets any setInterval timers running on the page.
        location /_next/webpack-hmr {
            proxy_pass http://vote:3000;
            proxy_http_version 1.1;
            proxy_set_header Host       localhost:3000;
            proxy_set_header Origin     "http://localhost:3000";
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://vote:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }

    server {
        listen 80;
        server_name result.test;

        # See vote.test for the rationale on Host=localhost for HMR.
        location /_next/webpack-hmr {
            proxy_pass http://result:3000;
            proxy_http_version 1.1;
            proxy_set_header Host       localhost:3000;
            proxy_set_header Origin     "http://localhost:3000";
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://result:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 86400s;
        }
    }

}
