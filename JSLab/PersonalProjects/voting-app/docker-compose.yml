services:
  vote:
    build:
      context: ./vote
      dockerfile: Dockerfile.dev
    volumes:
      - ./vote:/app
      - /app/node_modules
      - ./shared:/shared
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  result:
    build:
      context: ./result
      dockerfile: Dockerfile.dev
    volumes:
      - ./result:/app
      - /app/node_modules
    ports:
      - "3001:3000"
      - "9230:9230"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    depends_on:
      - db

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    volumes:
      - ./worker:/app
      - /app/node_modules
      - ./shared:/shared
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "9231:9231"
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./local-debug/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vote
      - result
      - worker
    restart: unless-stopped

volumes:
  db-data:
